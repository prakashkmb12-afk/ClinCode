name: clincode

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-clincode}
      POSTGRES_PASSWORD: ${DB_PASS:-clincode_dev_2026}
      POSTGRES_DB: ${DB_NAME:-clincode}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clincode} -d ${DB_NAME:-clincode}"]
      interval: 10s
      retries: 6
    networks: [clinnet]

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 15s
      retries: 5
    networks: [clinnet]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clincode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clincode_dev_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      retries: 6
    networks: [clinnet]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_DOCS};
      mc anonymous set none local/$${MINIO_BUCKET_DOCS};
      echo bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clincode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clincode_dev_2026}
      MINIO_BUCKET_DOCS: ${MINIO_BUCKET_DOCS:-clinical-documents}
    networks: [clinnet]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [clinnet]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks: [clinnet]

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  redis_data:
  mlflow_data:

networks:
  clinnet:
    driver: bridge